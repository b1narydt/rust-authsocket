[package]
name = "authsocket"
version = "0.4.1"
edition = "2021"
description = "BRC-103 mutually-authenticated Socket.IO for Rust — a faithful port of the TS @bsv authsocket / authsocket-client, sharing one wire contract across a socketioxide server and a rust_socketio client. Every application event (incl. room broadcasts) is signed and verified through a bsv-sdk BRC-103 Peer."
license = "MIT OR Apache-2.0"
repository = "https://github.com/b1narydt/rust-authsocket"

[features]
# Default builds only the transport-agnostic core (wire codec + ChannelTransport
# + PeerHandle) — always compiles, no Socket.IO backend pulled.
default = []
# Server side: the transport-agnostic AuthSocketServer room core plus the
# socketioxide adapter (matches rust-messagebox-server).
server = ["dep:socketioxide"]
# Client side: AuthSocketClient over rust_socketio (matches
# rust-messagebox-client).
client = ["dep:rust_socketio"]

[dependencies]
# BRC-103 auth engine (Peer, Transport, AuthMessage) — we wrap, never reimplement.
# Plain crates.io dependency: the whole consumer graph (rust-mpc,
# rust-messagebox-client) moved off git pins onto the published bsv-sdk, and a
# git-pinned copy here would split the graph into two bsv-sdk packages whose
# WalletInterface/Peer types don't unify. Version 0.7.1 is the minimum because
# it is the first release whose certificateResponse dispatch performs nonce,
# session, signature, replay, and certificate validation before delivery on
# Peer::on_certificates. Cargo.lock retains the exact resolved version.
bsv-sdk = { version = "0.7.1", features = ["network"] }

tokio = { version = "1", features = ["sync", "rt", "macros", "time"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# Brief, non-poisoning map locks (per-socket Arc cloned out; never held across await).
parking_lot = "0.12"
# join_all for concurrent per-member broadcast signing.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Socket.IO backends (optional, behind the `server` / `client` features).
socketioxide = { version = "0.15", optional = true }
rust_socketio = { version = "0.6", features = ["async"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
# End-to-end test: a real socketioxide server behind axum + the rust_socketio
# client, over loopback (tests/e2e.rs, requires --features server,client).
axum = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
